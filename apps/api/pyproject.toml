[project]
name = "qa-agentos-api"
version = "0.1.0"
description = "QA AgentOS FastAPI Backend Monolith"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "pgvector>=0.3.6",
    "pyjwt[crypto]>=2.10.0",
    "passlib[argon2]>=1.7.4",
    "argon2-cffi>=23.1.0",
    "httpx>=0.28.0",
    "structlog>=24.4.0",
    "redis>=5.2.0",
    "minio>=7.2.12",
    "python-multipart>=0.0.18",
    "langgraph>=0.2.0",
    "langgraph-checkpoint-postgres>=2.0.0",
    "psycopg[binary,pool]>=3.2.0",
    "hatchet-sdk>=0.30.0",
    "langfuse>=2.50.0",
    "jsonschema>=4.23.0",
    "pyyaml>=6.0.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "mypy>=1.13.0",
    "ruff>=0.8.0",
    "httpx>=0.28.0",
    "aiosqlite>=0.20.0"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qa_agentos"]
