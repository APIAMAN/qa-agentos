# Golden dataset v1 for the Bug Analyzer (see evals/README.md).
# expected.signatures / primary_signature are frozen log.parse outputs; a parser change that
# alters them must bump PARSER_VERSION and this dataset version.
dataset: bug-analyzer
version: v1
parser_version: 1.0.0
provenance: Synthetic logs written for QA AgentOS; no customer data. Credentials, tokens and emails in fixtures
  are fake and exist to test redaction.
labeling: Severity and category labeled by hand using the rubric in prompts/bug-analyzer/1.0.0.md.
cases:
- id: 01-checkout-keyerror
  log: logs/01-checkout-keyerror.log
  note: Checkout order placement fails with KeyError 'total' (HTTP 500).
  expected:
    severity: high
    category: functional
    primary_signature: sig_78639419da314aa0
    signatures:
    - sig_78639419da314aa0
    - sig_5f5a3d0221cbb4ef
    error_count: 4
