name: QA AgentOS CI

on:
  push:
    branches: [ main, feat/* ]
  pull_request:
    branches: [ main ]

jobs:
  backend-ci:
    name: Backend CI (Python / FastAPI)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: qa_agentos
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies from lockfile
        run: uv sync --locked --all-packages --all-extras --python 3.12

      - name: Run Ruff Linter
        run: uv run ruff check apps/api

      - name: Run Mypy Type Checker
        run: uv run mypy apps/api/src

      - name: Run Pytest Suite
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/qa_agentos
          TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/qa_agentos_test
          PYTHONPATH: apps/api/src
        run: uv run pytest apps/api/tests -v

      - name: Alembic Migration Validation
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/qa_agentos
          PYTHONPATH: apps/api/src
        run: |
          cd apps/api && uv run alembic upgrade head

  frontend-ci:
    name: Frontend CI (Next.js 16 / TypeScript)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Install dependencies
        run: |
          pnpm install --no-frozen-lockfile

      - name: Lint Next.js Frontend
        run: |
          pnpm --filter web lint

      - name: Typecheck Next.js Frontend
        run: |
          pnpm --filter web typecheck
