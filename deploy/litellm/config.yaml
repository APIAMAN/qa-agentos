model_list:
  - model_name: planner
    litellm_params:
      model: nvidia_nim/meta/llama-3.3-70b-instruct
      api_base: https://integrate.api.nvidia.com/v1
      api_key: os.environ/NVIDIA_NIM_API_KEY
  - model_name: classifier
    litellm_params:
      model: gemini/gemini-2.5-flash
      api_key: os.environ/GEMINI_API_KEY
  - model_name: mock-json
    litellm_params:
      model: gpt-3.5-turbo
      api_key: mock-key
      mock_response: '{"summary": "Mock test summary", "coverage_analysis": {"requirements_covered": ["REQ-1"], "edge_cases_identified": ["EDGE-1"]}, "test_cases": [{"id": "TC-001", "title": "Mock Test", "description": "Verify mock operation", "type": "functional", "priority": "high", "preconditions": [], "steps": ["step 1"], "expected_result": "success", "tags": ["mock"]}]}'

router_settings:
  routing_strategy: usage-based-routing-v2
  timeout: 30
