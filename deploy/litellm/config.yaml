model_list:
  - model_name: planner
    litellm_params:
      model: nvidia_nim/meta/llama-3.3-70b-instruct
      api_base: https://integrate.api.nvidia.com/v1
      api_key: os.environ/NVIDIA_NIM_API_KEY
  - model_name: classifier
    litellm_params:
      model: gemini/gemini-2.5-flash
      api_key: os.environ/GEMINI_API_KEY
  # Embeddings for bug duplicate detection (D1: Google Gemini). Only called when the app sets
  # EMBEDDINGS_ENABLED=true. LiteLLM 1.52 has no Gemini mapping for OpenAI's "dimensions"/"input_type",
  # so the Gemini-native fields below are forwarded as-is into each embedContent request.
  - model_name: embedder
    litellm_params:
      model: gemini/gemini-embedding-001
      api_key: os.environ/GEMINI_API_KEY
      outputDimensionality: 1536
      taskType: SEMANTIC_SIMILARITY
  # G-Eval judge for local agent evaluations only (decision D2; evals/run.py, EVAL_JUDGE_MODEL_KEY=judge).
  # Separate from the agent and embedding models. Never called by the app or by GitHub Actions.
  - model_name: judge
    litellm_params:
      model: gemini/gemini-3.5-flash-lite
      api_key: os.environ/GEMINI_API_KEY
  - model_name: mock-json
    litellm_params:
      model: gpt-3.5-turbo
      api_key: mock-key
      mock_response: '{"summary": "Mock test summary", "coverage_analysis": {"requirements_covered": ["REQ-1"], "edge_cases_identified": ["EDGE-1"]}, "test_cases": [{"id": "TC-001", "title": "Mock Test", "description": "Verify mock operation", "type": "functional", "priority": "high", "preconditions": [], "steps": ["step 1"], "expected_result": "success", "tags": ["mock"]}]}'

router_settings:
  routing_strategy: usage-based-routing-v2
  timeout: 30
