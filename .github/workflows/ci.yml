name: QA AgentOS CI

on:
  push:
    branches: [ main, feat/* ]
  pull_request:
    branches: [ main ]

jobs:
  backend-ci:
    name: Backend CI (Python / FastAPI)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: qa_agentos
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv & Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy pytest pytest-asyncio httpx pydantic pydantic-settings sqlalchemy asyncpg alembic pyjwt passlib argon2-cffi cryptography structlog redis minio python-multipart aiosqlite greenlet email-validator

      - name: Run Ruff Linter
        run: |
          ruff check apps/api

      - name: Run Pytest Suite
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/qa_agentos
          PYTHONPATH: apps/api/src
        run: |
          pytest apps/api/tests

      - name: Migration Drift Check
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/qa_agentos
          PYTHONPATH: apps/api/src
        run: |
          cd apps/api && alembic upgrade head

  frontend-ci:
    name: Frontend CI (Next.js 16 / TypeScript)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Install dependencies
        run: |
          pnpm install --no-frozen-lockfile

      - name: Typecheck Next.js Frontend
        run: |
          pnpm --filter web typecheck
