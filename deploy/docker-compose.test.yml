name: qa_p6_test

services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: p6test_postgres
    restart: "no"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: qa_agentos
    ports:
      - "5434:5432"
    volumes:
      - p6test_postgres_data:/var/lib/postgresql/data
      - ./postgres/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d qa_agentos"]
      interval: 3s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: p6test_redis
    restart: "no"
    ports:
      - "6380:6379"
    volumes:
      - p6test_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 10

  litellm:
    image: ghcr.io/berriai/litellm:main-v1.52.0
    container_name: p6test_litellm
    restart: "no"
    ports:
      - "4001:4000"
    volumes:
      - ./litellm/config.mock.yaml:/app/config.yaml
    environment:
      LITELLM_MASTER_KEY: sk-litellm-dev-master-key
      NVIDIA_NIM_API_KEY: dev_key
      GEMINI_API_KEY: dev_key
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/health/liveliness"]
      interval: 3s
      timeout: 3s
      retries: 10

  # Applies Hatchet's own schema to qa_agentos_hatchet (hatchet-admin does not).
  hatchet-migrate:
    image: ghcr.io/hatchet-dev/hatchet/hatchet-migrate:v0.111.0
    container_name: p6test_hatchet_migrate
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/qa_agentos_hatchet?sslmode=disable

  hatchet-setup:
    image: ghcr.io/hatchet-dev/hatchet/hatchet-admin:v0.111.0
    container_name: p6test_hatchet_setup
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
      hatchet-migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/qa_agentos_hatchet?sslmode=disable
    volumes:
      - p6test_hatchet_keys:/hatchet/keys
      - p6test_hatchet_config:/hatchet/config
      - ./hatchet/setup.sh:/setup.sh:ro
    entrypoint: ["/bin/sh", "/setup.sh"]

  hatchet:
    image: ghcr.io/hatchet-dev/hatchet/hatchet-engine:v0.111.0
    container_name: p6test_hatchet
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
      hatchet-setup:
        condition: service_completed_successfully
    command: ["/hatchet/hatchet-engine", "--config", "/hatchet/config"]
    volumes:
      - p6test_hatchet_keys:/hatchet/keys
      - p6test_hatchet_config:/hatchet/config
    ports:
      - "7078:7077"
      - "8081:8080"

  # Durable-execution worker used by apps/api/tests/live_integration_suite.py.
  worker:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    container_name: p6test_worker
    restart: on-failure
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      hatchet:
        condition: service_started
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/qa_agentos_test
      ENVIRONMENT: test
      MODEL_PROVIDER_ALLOWLIST: mock
      REDIS_URL: redis://redis:6379/0
      LITELLM_ENDPOINT: http://litellm:4000
      RUN_DISPATCHER: hatchet
      HATCHET_CLIENT_HOST_PORT: hatchet:7077
      HATCHET_CLIENT_SERVER_URL: http://hatchet:8080
      HATCHET_CLIENT_TLS_STRATEGY: tls
      HATCHET_CLIENT_TLS_ROOT_CA_FILE: /hatchet/keys/certs/ca.cert
      HATCHET_CLIENT_TLS_SERVER_NAME: cluster
    volumes:
      - p6test_hatchet_keys:/hatchet/keys:ro
      - p6test_hatchet_config:/hatchet/config:ro
    # Token is generated by hatchet-setup into the config volume.
    entrypoint: ["/bin/sh", "-c", "export HATCHET_CLIENT_TOKEN=\"$$(cat /hatchet/config/token.txt)\" && exec python -m qa_agentos.workers.main"]

volumes:
  p6test_postgres_data:
  p6test_redis_data:
  p6test_hatchet_keys:
  p6test_hatchet_config:
