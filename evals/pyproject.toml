[project]
name = "qa-agentos-evals"
version = "0.1.0"
description = "QA AgentOS agent evaluations (golden datasets, deterministic scoring, G-Eval gates)."
requires-python = ">=3.12"
# Separate project + lockfile on purpose: eval tooling (DeepEval) must never change the
# production dependency set in the workspace uv.lock.
dependencies = [
    "qa-agentos-api",
    "deepeval>=3.0",
    "pyyaml>=6.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "aiosqlite>=0.20.0",
]

[tool.uv]
package = false

[tool.uv.sources]
qa-agentos-api = { path = "../apps/api", editable = true }

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = [".", "../apps/api/src"]
