[project]
name = "qa-agentos"
version = "0.1.0"
description = "QA AgentOS — Single-Modular-Monolith QA Agent Platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[tool.uv.workspace]
members = ["apps/api"]
# evals/ is its own uv project with its own lockfile (keeps eval tooling out of uv.lock).
exclude = ["evals"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["apps/api/tests"]
pythonpath = ["apps/api/src"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["B008", "E501"]
