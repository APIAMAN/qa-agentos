tools:
  - name: util.echo
    version: 1.0.0
    description: Echoes back the input message and metadata for testing and connectivity verification.
    kind: builtin
    implementation: qa_agentos.tools.builtin.util:echo
    permissions: []
    timeout_ms: 10000
    retry_policy:
      max_attempts: 2
      backoff: exponential
    idempotent: true
    status: active
    input_schema:
      $schema: "https://json-schema.org/draft/2020-12/schema"
      title: UtilEchoInput
      type: object
      required:
        - message
      properties:
        message:
          type: string
          description: Message payload to be echoed back.
        metadata:
          type: object
          description: Optional arbitrary metadata to echo.
      additionalProperties: false
    output_schema:
      $schema: "https://json-schema.org/draft/2020-12/schema"
      title: UtilEchoOutput
      type: object
      required:
        - echoed_message
        - timestamp
      properties:
        echoed_message:
          type: string
          description: Echoed message payload.
        timestamp:
          type: string
          format: date-time
          description: ISO timestamp of echo execution.
        metadata:
          type: object
          description: Echoed metadata payload.
      additionalProperties: false

  - name: log.parse
    version: 1.0.0
    description: >
      Deterministically parses a log bundle (uploaded artifact or short inline text) into a
      sanitized summary: error signatures with counts, exception types, top stack frames and the
      time window. Secrets, tokens and emails are redacted before anything is returned.
    kind: builtin
    implementation: qa_agentos.tools.builtin.logparse:log_parse
    permissions:
      - artifact:read
    timeout_ms: 20000
    retry_policy:
      max_attempts: 2
      backoff: exponential
    idempotent: true
    status: active
    input_schema:
      $schema: "https://json-schema.org/draft/2020-12/schema"
      title: LogParseInput
      type: object
      properties:
        artifact_id:
          type: string
          format: uuid
          description: Id of a log/text/json artifact in the run's project (preferred; up to 2 MiB is parsed).
        text:
          type: string
          maxLength: 65536
          description: Inline log text (small snippets only).
      oneOf:
        - required: [artifact_id]
        - required: [text]
      additionalProperties: false
    output_schema:
      $schema: "https://json-schema.org/draft/2020-12/schema"
      title: LogParseOutput
      type: object
      required:
        - parser_version
        - format
        - total_lines
        - error_count
        - warning_count
        - distinct_signatures
        - time_window
        - primary_signature
        - signatures
        - redactions
        - truncated
      properties:
        parser_version: {type: string}
        format: {type: string}
        total_lines: {type: integer, minimum: 0}
        error_count: {type: integer, minimum: 0}
        warning_count: {type: integer, minimum: 0}
        distinct_signatures: {type: integer, minimum: 0}
        time_window:
          oneOf:
            - type: "null"
            - type: object
              required: [start, end]
              properties:
                start: {type: string}
                end: {type: string}
        primary_signature: {type: ["string", "null"], pattern: "^sig_[0-9a-f]{16}$"}
        signatures:
          type: array
          maxItems: 25
          items:
            type: object
            required: [signature, kind, exception_type, message, level, count, first_seen, last_seen, top_frames, samples]
            properties:
              signature: {type: string, pattern: "^sig_[0-9a-f]{16}$"}
              kind: {enum: [exception, error_line]}
              exception_type: {type: ["string", "null"]}
              message: {type: string, maxLength: 500}
              level: {type: string}
              count: {type: integer, minimum: 1}
              first_seen: {type: ["string", "null"]}
              last_seen: {type: ["string", "null"]}
              top_frames: {type: array, maxItems: 5, items: {type: string, maxLength: 500}}
              samples: {type: array, maxItems: 3, items: {type: string, maxLength: 500}}
            additionalProperties: false
        redactions: {type: integer, minimum: 0}
        truncated: {type: boolean}
        source:
          type: object
          properties:
            artifact_id: {type: string}
            name: {type: string}
            size_bytes: {type: integer}
      additionalProperties: false
